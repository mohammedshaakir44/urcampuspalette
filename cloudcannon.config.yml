# cloudcannon.config.yml

# 1. Identify the SSG
ssg_name: nextjs

# 2. Define important paths
paths:
  static: public       # Where your images/assets live
  uploads: public/uploads # Added this line to fix the "Invalid global paths" error
  src: src             # Where your components/pages live (if using src folder)
  data: data           # Where your JSON/YAML data files live

# 3. Configure the Editor
_enabled_editors:
  - visual
  - content
  - source

# 4. Define Collections (Optional but recommended)
# This allows the "Data Editor" to show your blog posts or products
collections_config:
  pages:
    path: content/pages
    output: true
    icon: description